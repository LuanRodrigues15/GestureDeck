name: Bloquear arquivos internos

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Impedir CLAUDE.md e CONTEXTO.md na main
        run: |
          erro=0
          for arquivo in CLAUDE.md CONTEXTO.md; do
            if [ -e "$arquivo" ]; then
              echo "::error::$arquivo não pode ir para a main"
              erro=1
            fi
          done
          exit $erro
